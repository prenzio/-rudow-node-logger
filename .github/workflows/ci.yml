name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Load ESM and CommonJS builds
        run: |
          node --input-type=module -e "import { createLogger } from '@rudow/node-logger'; if (typeof createLogger !== 'function') process.exit(1)"
          node -e "const { createLogger } = require('@rudow/node-logger'); if (typeof createLogger !== 'function') process.exit(1)"
      - run: npm pack --dry-run
